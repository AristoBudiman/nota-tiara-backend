name: notatiara
services:
  db:
    image: postgres:16-alpine
    container_name: nota_tiara_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - nota_tiara_data:/var/lib/postgresql/data

  backend:
    build: 
      context: .
      dockerfile: dockerfile.dev 
    container_name: nota_tiara_backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - .:/app 
    env_file:
      - .env 
    environment:
      DB_HOST: db
      DB_PORT: 5432

volumes:
  nota_tiara_data: