          $ref: '#/definitions/models.NotaInput'
      produces:
      - application/json
      responses:
        "200":
          description: 'Pesan: Nota berhasil diupdate!'
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "400":
          description: Format data JSON tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Nota tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Kesalahan eksekusi database / kas
          schema:
            additionalProperties: true
            type: object
      summary: Ubah data Nota Reguler
      tags:
      - 08. Nota Reguler
  /notas/{id}/batal:
    put:
      consumes:
      - application/json
      description: Mengubah status nota menjadi 'DIBATALKAN'. Jika sebelumnya lunas,
        sistem otomatis akan menarik uang dari brankas/kas untuk menjaga integritas
        pembukuan.
      parameters:
      - description: ID Nota
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'Pesan: Nota berhasil dibatalkan'
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "404":
          description: Nota tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Kesalahan saat membatalkan transaksi kas
          schema:
            additionalProperties: true
            type: object
      summary: Batalkan Nota Reguler (Rollback)
      tags:
      - 08. Nota Reguler
  /notas/{id}/pulihkan:
    put:
      consumes:
      - application/json
      description: Mengembalikan status nota dari 'DIBATALKAN' menjadi 'KIRIM'. Menginjeksi
        ulang uang ke brankas jika nota tercatat lunas.
      parameters:
      - description: ID Nota
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'Pesan: Nota berhasil dipulihkan'
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "404":
          description: Nota tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Kesalahan server
          schema:
            additionalProperties: true
            type: object
      summary: Pulihkan Nota Reguler
      tags:
      - 08. Nota Reguler
  /notas/next-number:
    get:
      consumes:
      - application/json
      description: 'Meng-generate nomor nota urut yang pintar berdasarkan tanggal
        dan ID toko (Cth: NT/20260427/15-0017)'
      parameters:
      - description: Filter berdasarkan ID Toko (Jika 0 = Pabrik)
        in: query
        name: toko_id
        type: string
      - description: 'Format: YYYY-MM-DD (Default: Hari ini)'
        in: query
        name: tanggal
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NextNotaResponse'
      summary: Dapatkan nomor nota berikutnya
      tags:
      - 08. Nota Reguler
  /sales/dashboard:
    get:
      consumes:
      - application/json
      description: 'Menarik 3 himpunan tugas sekaligus untuk user sales yang login:
        Nota aktif 8 jam terakhir, Tugas membereskan retur (Reguler), dan Tugas mengantar
        pesanan khusus (PO).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DashboardSalesResponse'
      summary: Muat Dashboard Sales / Kurir
      tags:
      - 16. Distribusi Lapangan
  /sales/kunjungan/{toko_id}:
    get:
      consumes:
      - application/json
      description: Mengecek apakah sebuah toko memiliki nota berstatus 'KIRIM' namun
        belum diselesaikan proses returnya. Digunakan untuk memblokir pembuatan nota
        baru oleh sales.
      parameters:
      - description: ID Toko
        in: path
        name: toko_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Nota'
            type: array
      summary: Sidak Dosa Retur Toko
      tags:
      - 16. Distribusi Lapangan
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: "Bearer {token_jwt}"'
